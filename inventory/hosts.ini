[jenkins]
machine01 ansible_host=192.168.56.11 ansible_user=ubuntu domain_name=jenkins.devops.local service_port=8080

[sonarqube]
machine02 ansible_host=192.168.56.12 ansible_user=ubuntu domain_name=sonarqube.devops.local service_port=9000

[nexus]
machine03 ansible_host=192.168.56.13 ansible_user=ubuntu domain_name=nexus.devops.local service_port=8081

[all_nodes:children]
jenkins
sonarqube
nexus

[all_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
base_domain=devops.local
ssl_cert_type=self_signed 
admin_email=admin@devops.local
app_root_dir=/opt/devops-stack
