---
- name: Create Jenkins stack directory
  file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: '0755'

- name: Create Jenkins home directory with UID 1000
  file:
    path: "{{ jenkins_home }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'

- name: Deploy Jenkins docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Jenkins Docker Compose stack
  command: docker compose up -d
  args:
    chdir: "{{ jenkins_dir }}"

- name: Wait for Jenkins to become responsive on port {{ jenkins_service_port }}
  wait_for:
    host: 127.0.0.1
    port: "{{ jenkins_service_port }}"
    delay: 10
    timeout: 180

- name: Display Jenkins initial admin password path
  debug:
    msg: "Jenkins is running! Access via https://{{ jenkins_domain }} (Initial admin password stored at: {{ jenkins_home }}/secrets/initialAdminPassword)"
