---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base utility packages
  apt:
    name: "{{ common_packages }}"
    state: present

- name: Add GitHub CLI GPG official key
  shell: |
    mkdir -p -m 755 /etc/apt/keyrings
    wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
    chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI apt repository
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/github-cli.list

- name: Install GitHub CLI (gh)
  apt:
    name: gh
    state: present
    update_cache: yes

- name: Check if Oh My Zsh is installed for {{ ansible_user }}
  stat:
    path: "/home/{{ ansible_user }}/.oh-my-zsh"
  register: omz_stat

- name: Install Oh My Zsh unattended for {{ ansible_user }}
  shell: |
    curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | sh -s -- --unattended
  become: yes
  become_user: "{{ ansible_user }}"
  when: not omz_stat.stat.exists
  ignore_errors: yes

- name: Deploy tailored .zshrc configuration
  template:
    src: zshrc.j2
    dest: "/home/{{ ansible_user }}/.zshrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: omz_stat.stat.exists or true

- name: Ensure app root directory exists
  file:
    path: "{{ app_root_dir }}"
    state: directory
    mode: '0755'
