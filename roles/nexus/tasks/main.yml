- name: Create Nexus directory
  file:
    path: "{{ nexus_dir }}"
    state: directory
    mode: '0755'

- name: Create Nexus data directory with UID 200
  file:
    path: "{{ nexus_data_dir }}"
    state: directory
    owner: "200"
    group: "200"
    mode: '0775'

- name: Deploy Nexus docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ nexus_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Nexus Docker Compose stack
  command: docker compose up -d
  args:
    chdir: "{{ nexus_dir }}"

- name: Wait for Nexus port {{ nexus_service_port }} to respond
  wait_for:
    host: 127.0.0.1
    port: "{{ nexus_service_port }}"
    delay: 15
    timeout: 300

- name: Nexus status message
  debug:
    msg: "Nexus is running! Access via https://{{ nexus_domain }} (Initial admin password stored at: {{ nexus_data_dir }}/admin.password)"
